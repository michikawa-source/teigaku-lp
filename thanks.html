<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お問い合わせありがとうございます｜リスティング定額便</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f2faff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#0b377f}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:720px;width:100%;background:#fff;border-radius:28px;padding:56px 34px;text-align:center;box-shadow:0 20px 50px rgba(34,82,125,.10)}
    .icon{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#eaf5ff;color:#0d5bd7;font-size:38px;font-weight:900}
    h1{font-size:34px;margin:0 0 20px}
    p{font-size:17px;line-height:1.9;color:#405d82}
    a{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:999px;background:#ff641d;color:#fff;text-decoration:none;font-weight:800}
    @media(max-width:600px){.card{padding:42px 20px}h1{font-size:27px}p{font-size:15px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">✓</div>
      <h1>お問い合わせありがとうございます</h1>
      <p>無料相談のお申し込みを受け付けました。<br>内容を確認のうえ、1営業日以内を目安にご連絡いたします。</p>
      <a href="https://teigaku.yolo-corp.com/">トップへ戻る</a>
    </div>
  </div>
</body>
</html>
