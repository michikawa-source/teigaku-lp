<body>
  <main class="lp">
    <section id="top" class="visual-section hero-wrap">
      <img src="./assets/01-hero.png" alt="リスティング定額便 月額5万円ぽっきり" fetchpriority="high">
      <!-- 画像内ナビ・CTAをクリック可能にする透明リンク -->
      <a class="hotspot hs-service" href="#service" aria-label="サービス内容"></a>
      <a class="hotspot hs-price" href="#price" aria-label="料金"></a>
      <a class="hotspot hs-case" href="#case" aria-label="導入事例"></a>
      <a class="hotspot hs-faq" href="#faq" aria-label="よくある質問"></a>
      <a class="hotspot hs-top-cta" href="#contact" aria-label="無料相談を申し込む"></a>
      <a class="hotspot hs-main-cta" href="#contact" aria-label="無料相談を申し込む"></a>
    </section>

    <section id="trouble" class="visual-section">
      <img src="./assets/02-trouble.png" alt="こんなお悩みありませんか？" loading="lazy">
    </section>

    <section id="service" class="visual-section">
      <img src="./assets/03-service.png" alt="サービス内容" loading="lazy">
    </section>

    <section id="price" class="visual-section">
      <img src="./assets/04-price.png" alt="料金 月額固定5万円 初期費用49,800円" loading="lazy">
    </section>

    <section id="case" class="visual-section">
      <img src="./assets/05-case.png" alt="導入事例" loading="lazy">
    </section>

    <section id="team" class="visual-section">
      <img src="./assets/06-team.png" alt="運用するのは大手出身のプロだけ" loading="lazy">
    </section>

    <section id="flow" class="visual-section">
      <img src="./assets/07-flow.png" alt="導入までの4ステップ" loading="lazy">
    </section>

    <section id="faq" class="visual-section">
      <img src="./assets/08-faq.png" alt="よくある質問" loading="lazy">
    </section>

    <section id="contact" class="contact-section">
      <div class="contact-card">
        <div class="contact-copy">
          <div class="limited">毎月 <strong>5社限定</strong></div>
          <p class="eyebrow">まずはお気軽にご相談ください</p>
          <h2>リスティング広告の<br>無料相談 実施中！</h2>
          <p>現状の広告アカウントの課題診断も<br>あわせて対応します。<br>1営業日以内にご連絡します。</p>
        </div>

        <form class="contact-form"
          action="https://formsubmit.co/m.ichikawa@yolo-inc.net"
          method="POST">
          <input type="hidden" name="_subject" value="【リスティング定額便】無料相談のお問い合わせ">
          <input type="hidden" name="_next" value="https://teigaku.yolo-corp.com/thanks.html">
          <input type="hidden" name="_captcha" value="false">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

          <label>
            <span>お名前 <b>必須</b></span>
            <input type="text" name="お名前" placeholder="山田 太郎" required>
          </label>

          <label>
            <span>会社名 <b>必須</b></span>
            <input type="text" name="会社名" placeholder="株式会社サンプル" required>
          </label>

          <label>
            <span>メールアドレス <b>必須</b></span>
            <input type="email" name="メールアドレス" placeholder="yamada@sample.co.jp" required>
          </label>

          <label>
            <span>電話番号 <b>必須</b></span>
            <input type="tel" name="電話番号" placeholder="090-1234-5678" required>
          </label>

          <label class="wide">
            <span>ご相談内容 <b>必須</b></span>
            <textarea name="ご相談内容" placeholder="広告運用について相談したい" required></textarea>
          </label>

          <button type="submit">無料相談を申し込む <span>→</span></button>
        </form>
      </div>
    </section>
  </main>

  <a class="floating-cta" href="#contact">
    <span class="pc-label">毎月5社限定｜無料相談はこちら</span>
    <span class="sp-label">無料相談はこちら</span>
